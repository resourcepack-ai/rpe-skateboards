plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'skateboards'

// ai.resourcepack:common, the small library our plugins shade in: built from
// source when a checkout of it is two folders up, and from
// repo.resourcepack.ai otherwise.
if (file('../../plugin-common').isDirectory()) {
    includeBuild('../../plugin-common')
}
