# The skatepark. Every piece is placeable and every piece holds a
# vehicle up on its own cubes, which is what lets a board roll up a

park_flat_slab:
  material: PAPER
  model: park_flat_slab
  name: "&bPark Floor Slab"
  lore:
    - "&7Right-click the ground to place it."
    - "&7Punch it to take it back."
