skateboard:
  model: skateboards:deck
  name: "&bSkateboard"
  medium: land
  # `speed` is the TUCKED top speed. Standing up, the plugin caps it lower
  # (SkateboardMechanics.CRUISE_LIMIT) and only the tuck lifts the cap.
  speed: 13
  # Almost no throttle of its own: W does not drive a skateboard, pushing
  # does, and the plugin does the pushing with Vehicle.nudge.
  acceleration: 0.6
  # A board rolls. The engine's own floor is a car coasting to a halt in a few
  # seconds, which is wrong for anything without an engine in it - this is what
  # the plugin used to buy back by hand, twenty times a second.
  coast: 0.15
  # Land a long way round from the way you are going and you come off it.
  # Straight is fine and so is straight backwards, which is a fakie.
  bail:
    from: 50
    to: 130
    min-speed: 3.0
    damage: 1.0
  turn-speed: 160
  weight: 10
  scale: 0.5
  # Space is an ollie, not a handbrake.
  jump: true
  # Jump at a wall fast enough and shallow enough and the board holds itself
  # against it until the speed runs out. The engine does the physics; the
  # plugin only dresses the rider for it (Vehicle.wallRiding).
  wall-ride: true
  # The wheel cycle is driven by how far the board has ROLLED rather than by
  # how long it has been playing: at the tucked top speed it runs at the rate
  # it was drawn at, at a crawl it crawls, and standing still it stops with
  # the wheels where they are.
  animation-follows-speed: true
  hitbox:
    width: 0.5
    height: 0.5
    length: 1.5
  seats:
    # Side-on, regular stance: chest to the board's right, left foot leading,
    # head turned to look down the board. Standing, on the deck.
    - role: driver
      x: 0
      y: 0.625
      z: 0
      yaw: 90
      pose: standing
      animations:
        airborne: skateboards_airborne
        turning: skateboards_turning
        reversing: skateboards_reversing
        moving: skateboards_moving
        idle: skateboards_idle
  animations:
    airborne: airborne
    turning: turning
    reversing: reversing
    moving: moving
    idle: idle
