# Skateboards for RP Engine.
#
# Everything the plugin says is here, and so is whether it is allowed to
# throw you off. The board itself - its model, its speed, its seat, its rider
# animations - is not: that is ordinary RP Engine content, installed into
# plugins/RPEngine/content/skateboards/, and you can edit it there.
#
# Colours are the usual & codes. /skateboard reload picks up a change to this
# file without a restart.

# What every message is said behind. Set it to "" for none.
prefix: "&b[Skateboards] &7"

# Land the board a long way round from the way it is travelling and the rider
# comes off it, takes half a heart and gets told so. Straight is fine and so
# is straight backwards - it is the sideways landing that bails you.
#
# Set this to false and a sideways landing simply carries on. Nothing else
# changes: the flick, the fakie and the "landed it" message are all still
# there, and the rider still has to be ON the board to do any of them.
bail: true

# Whether the board talks to its rider about what they just did: "Landed it",
# "Fakie!", and the line that tells you why you are suddenly standing in the
# road. On by default, because a trick nobody is told they landed is a trick
# nobody knows they can do.
#
# Turn it off for a server where the chat is for people. Nothing else changes:
# the bail still throws you, the fakie is still a fakie, they just happen
# quietly.
trick-messages: true

# Give every player a board the first time they join, so nobody has to be
# told a command exists. Off, because a plugin that puts something in
# somebody's inventory uninvited is a plugin a server owner has to undo -
# and a server that wants this usually wants it once rather than every time,
# which is what `first-join-only` is.
#
# Needs `skateboards.use`, so revoking that permission also stops the gift.
give-on-join: false
first-join-only: true

# Nudges you in the console on startup and in chat on join when an update is out.
update-check: true

# Putting one down without an item. /skateboard here makes a board out of nothing,
# so it needs skateboards.here (ops only by default); the item is the way
# everybody else parks one. Either way the same placement question is asked
# first that the engine asks of the item (ModelPlaceEvent), so a WorldGuard
# region, a lobby guard or anything else that keeps models out of a place
# keeps these out too.
#
# On top of that, a command-made board has a cooldown and a cap per player.
# The cap counts every board that player has standing in loaded chunks,
# however they put it down; -1 for no cap. skateboards.here.unlimited skips both.
#
# Picking one up (sneak and right-click it) is only for the player who put it
# down, or anyone with skateboards.pickup.others (ops by default). One parked
# before owners were recorded is anybody's, as it always was.
spawn-limits:
  cooldown-seconds: 10
  max-per-player: 2

messages:
  players-only: "Only a player can hold a skateboard."
  given: "Here's a board. Right-click the ground to set it down, W to push, S to push it backwards, hold sprint to tuck, hold shift to lie back, space to ollie, A/D in the air to spin it, and HOLD space against a wall to ride it. Tap shift to step off. /skateboard stance right if you ride right foot forward."
  no-item: "The engine has no skateboard item yet - has it finished loading? Try /rp reload."
  placed: "Board's down. Right-click it to step on."
  place-failed: "Couldn't set a board down there."
  here-denied: "Setting a board down with /skateboard here is for staff. Right-click the ground with the board instead."
  spawn-cooldown: "Give it {seconds}s before putting another one down."
  spawn-limit: "You already have &f{count}&7 boards out. Sneak and right-click one to pick it up first."
  place-denied: "You can't put a board down here."
  pickup-not-yours: "That isn't yours to pick up."
  pickup-denied: "You can't pick that up here."
  # {stance} is "left" or "right" - which foot leads.
  stance-current: "You ride &f{stance} foot forward&7. /skateboard stance left|right to change."
  stance-set: "You ride &f{stance} foot forward&7 now."
  stance-set-riding: "You ride &f{stance} foot forward&7 now - turning you round."
  landed: "Landed it."
  fakie: "Fakie!"
  bailed: "&cBailed! &7Land it straight (or straight backwards) next time."
  reloaded: "Config reloaded."
  # {count} is how many pieces there are, {pieces} the list of their names.
  park-list: "&f{count}&7 skatepark pieces: &f{pieces}&7. /skatepark <piece> for one, /skatepark all for the lot."
  # {piece} is the piece's name, as you type it.
  park-given: "Here's a &f{piece}&7. Right-click the ground to place it, punch it to take it back."
  park-all: "There you go - all &f{count}&7 pieces. Build something."
  park-unknown: "There's no park piece called &f{piece}&7. /skatepark to see them all."
  park-none: "The engine has no park pieces yet - has it finished loading? Try /rp reload."
  # Told to ops as they join. {latest} is the new version, {running} this one's.
  update: "Skateboards &f{latest}&7 is out (you have {running}). "
  update-link: "&b&nGet it on SpigotMC"
