name: RPESkateboards
main: ai.resourcepack.addons.skateboards.SkateboardsPlugin
version: ${version}
api-version: '1.19'
description: Skateboards for RP Engine - push, tuck, jump, flick it round, and try not to bail.
author: ResourcePack AI
# Hard, not soft: there is nothing here without the engine. The board, its
# item, its animations and its physics are all the engine's; this plugin is
# the skating on top.
depend: [RPEngine]

commands:
  skateboard:
    description: Get a skateboard, or set one down in front of you.
    usage: /<command> [controls | stance <left|right> | here | reload]
    permission: skateboards.use
  skatepark:
    description: Get the pieces you build a skatepark out of.
    usage: /<command> [piece | all]
    permission: skateboards.park

permissions:
  skateboards.use:
    description: Get a skateboard. Putting one down with the command is skateboards.here.
    default: true
  skateboards.ride:
    description: Get on a skateboard that is already down.
    default: true
  skateboards.park:
    description: Get skatepark pieces to place.
    default: op
  skateboards.here:
    description: Put a board down in front of you with /skateboard here, without an item.
    default: op
  skateboards.here.unlimited:
    description: Skip the cooldown and the per-player cap on boards made by command.
    default: op
  skateboards.pickup.others:
    description: Pick up a board somebody else put down.
    default: op
  skateboards.reload:
    description: Reload the skateboard config.
    default: op
  skateboards.update:
    description: Be told on joining when a newer Skateboards is on SpigotMC.
    default: op
